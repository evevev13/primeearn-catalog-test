<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrimeEarn Catalog Test — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f3efe6;
        --ink: #182025;
        --muted: #5a6168;
        --card: #fffdf9;
        --line: #d8d2c5;
        --accent: #004f5a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'IBM Plex Sans', sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 15% 10%, #f8d58f 0%, transparent 30%),
          radial-gradient(circle at 85% 15%, #9fd0d8 0%, transparent 28%),
          linear-gradient(160deg, #f7f3eb 0%, #f0e8d8 100%);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 48px 40px;
        max-width: 400px;
        width: 100%;
        text-align: center;
        box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      }
      .kicker {
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent);
        font-size: 0.76rem;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 8px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.8rem;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin: 0 0 32px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .btn-google {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 8px;
        transition: opacity 0.15s;
      }
      .btn-google:hover { opacity: 0.88; }
      .btn-google svg { flex-shrink: 0; }
      .domain-note {
        margin: 20px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .error-msg {
        display: none;
        margin: 0 0 20px;
        padding: 10px 14px;
        background: #fef2f2;
        border: 1px solid #fca5a5;
        border-radius: 8px;
        color: #9b1c1c;
        font-size: 0.85rem;
      }
      .error-msg.visible { display: block; }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="kicker">PrimeEarn integration smoke test</p>
      <h1>Sign in</h1>
      <p class="subtitle">Access is restricted to PrimeInsights team members.</p>
      <div class="error-msg" id="errorMsg">Access denied. Only @primeinsights.com accounts are allowed.</div>
      <a href="/auth/google" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615Z" fill="#fff" fill-opacity=".9"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18Z" fill="#fff" fill-opacity=".75"/>
          <path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332Z" fill="#fff" fill-opacity=".6"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58Z" fill="#fff" fill-opacity=".5"/>
        </svg>
        Sign in with Google
      </a>
      <p class="domain-note">Only @primeinsights.com accounts are allowed.</p>
    </div>
    <script>
      if (new URLSearchParams(location.search).get('error')) {
        document.getElementById('errorMsg').classList.add('visible');
      }
    </script>
  </body>
</html>
